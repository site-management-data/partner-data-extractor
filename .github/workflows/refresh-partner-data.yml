name: Refresh partner data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate workbook
        env:
          PARTNER_NAME: MAAN
          OUTPUT_FILENAME: MAAN_Partner_Data.xlsx
          OUTPUT_DIRECTORY: outputs
          INCLUDE_ALERTS: "true"
          INCLUDE_REFERRALS: "true"
          ACTIVITY_PARTNER_COLUMN: Agency
          SITE_LIST_URL: ${{ secrets.SITE_LIST_URL }}
          ACTIVITY_URL: ${{ secrets.ACTIVITY_URL }}
          SITE_MONITORING_URL: ${{ secrets.SITE_MONITORING_URL }}
          CONTACTS_URL: ${{ secrets.CONTACTS_URL }}
          SITE_ALERT_URL: ${{ secrets.SITE_ALERT_URL }}
          REFERRALS_URL: ${{ secrets.REFERRALS_URL }}
        run: python main.py

      - name: Prepare download page
        run: |
          mkdir -p public
          cp outputs/MAAN_Partner_Data.xlsx public/MAAN_Partner_Data.xlsx

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>MAAN Partner Data</title>
            <style>
              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f4f6f8;
                color: #1f2937;
              }
              main {
                max-width: 680px;
                margin: 12vh auto;
                padding: 48px;
                background: white;
                border-radius: 14px;
                box-shadow: 0 10px 30px rgba(0,0,0,.08);
                text-align: center;
              }
              h1 {
                margin-top: 0;
              }
              p {
                line-height: 1.6;
              }
              a {
                display: inline-block;
                margin-top: 18px;
                padding: 14px 22px;
                border-radius: 8px;
                background: #0057a8;
                color: white;
                text-decoration: none;
                font-weight: bold;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>MAAN Partner Data</h1>
              <p>
                Download the latest automatically generated partner data
                workbook from Zite Manager.
              </p>
              <a href="MAAN_Partner_Data.xlsx" download>
                Download latest workbook
              </a>
            </main>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4