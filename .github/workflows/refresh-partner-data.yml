name: Refresh partner data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        partner:
          - MAAN
          - ACTED
          - BLDA
          - NRC
          - PHC
          - CESVI
          - AIOCP
          - FAFD

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate workbook
        env:
          PARTNER_NAME: ${{ matrix.partner }}
          OUTPUT_FILENAME: ${{ matrix.partner }}_Partner_Data.xlsx
          OUTPUT_DIRECTORY: outputs
          INCLUDE_ALERTS: "true"
          INCLUDE_REFERRALS: "true"
          ACTIVITY_PARTNER_COLUMN: Agency
          SITE_LIST_URL: ${{ secrets.SITE_LIST_URL }}
          ACTIVITY_URL: ${{ secrets.ACTIVITY_URL }}
          SITE_MONITORING_URL: ${{ secrets.SITE_MONITORING_URL }}
          CONTACTS_URL: ${{ secrets.CONTACTS_URL }}
          SITE_ALERT_URL: ${{ secrets.SITE_ALERT_URL }}
          REFERRALS_URL: ${{ secrets.REFERRALS_URL }}
        run: python main.py

      - name: Upload partner workbook
        uses: actions/upload-artifact@v4
        with:
          name: partner-${{ matrix.partner }}
          path: outputs/${{ matrix.partner }}_Partner_Data.xlsx
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download partner workbooks
        uses: actions/download-artifact@v4
        with:
          path: workbooks

      - name: Prepare partner download pages
        run: |
          mkdir -p public/maan
          mkdir -p public/acted
          mkdir -p public/blda
          mkdir -p public/nrc
          mkdir -p public/phc
          mkdir -p public/cesvi
          mkdir -p public/fafd
          mkdir -p public/aiocp

          cp workbooks/partner-MAAN/MAAN_Partner_Data.xlsx public/maan/
          cp workbooks/partner-ACTED/ACTED_Partner_Data.xlsx public/acted/
          cp workbooks/partner-BLDA/BLDA_Partner_Data.xlsx public/blda/
          cp workbooks/partner-NRC/NRC_Partner_Data.xlsx public/nrc/
          cp workbooks/partner-PHC/PHC_Partner_Data.xlsx public/phc/
          cp workbooks/partner-CESVI/CESVI_Partner_Data.xlsx public/cesvi/
          cp workbooks/partner-AIOCP/AIOCP_Partner_Data.xlsx public/aiocp/
          cp workbooks/partner-FAFD/FAFD_Partner_Data.xlsx public/fafd/

          UPDATED_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"

          create_page () {
            PARTNER="$1"
            FOLDER="$2"
            FILE="$3"

            cat > "public/${FOLDER}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Site Management Partner Data - ${PARTNER}</title>
            <style>
              * { box-sizing: border-box; }

              body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family: Arial, Helvetica, sans-serif;
                background: #f5f6f7;
                color: #252a2e;
              }

              main {
                width: 100%;
                max-width: 620px;
                padding: 42px;
                background: #ffffff;
                border: 1px solid #e2e5e8;
                border-radius: 8px;
              }

              h1 {
                margin: 0 0 12px;
                font-size: 26px;
                font-weight: 600;
                line-height: 1.3;
              }

              .updated {
                margin: 0 0 30px;
                color: #667078;
                font-size: 14px;
              }

              .download-link {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: #2f5f4f;
                font-size: 15px;
                font-weight: 600;
                text-decoration: none;
              }

              .download-link:hover {
                text-decoration: underline;
              }

              .excel-icon {
                width: 24px;
                height: 24px;
                flex-shrink: 0;
              }
            </style>
          </head>

          <body>
            <main>
              <h1>Site Management Partner Data - ${PARTNER}</h1>

              <p class="updated">
                Last updated: ${UPDATED_AT}
              </p>

              <a class="download-link" href="${FILE}" download>
                <svg class="excel-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect
                    x="3"
                    y="2"
                    width="18"
                    height="20"
                    rx="2"
                    fill="#e7f0ec"
                    stroke="#477361"
                  />
                  <path
                    d="M8 8l3 4-3 4M14 8v8"
                    fill="none"
                    stroke="#477361"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Download latest Excel workbook
              </a>
            </main>
          </body>
          </html>
          EOF
          }

          create_page "MAAN" "maan" "MAAN_Partner_Data.xlsx"
          create_page "ACTED" "acted" "ACTED_Partner_Data.xlsx"
          create_page "BLDA" "blda" "BLDA_Partner_Data.xlsx"
          create_page "NRC" "nrc" "NRC_Partner_Data.xlsx"
          create_page "PHC" "phc" "PHC_Partner_Data.xlsx"
          create_page "CESVI" "cesvi" "CESVI_Partner_Data.xlsx"
          create_page "AIOCP" "aiocp" "AIOCP_Partner_Data.xlsx"
          create_page "FAFD" "fafd" "FAFD_Partner_Data.xlsx"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
